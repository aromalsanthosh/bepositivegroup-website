<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#f5f7fb;
background:radial-gradient(700px 520px at 18% 20%,rgba(29,91,240,.55),transparent 70%),radial-gradient(600px 500px at 95% 100%,rgba(29,91,240,.35),transparent 70%),#02040a;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;align-items:center;gap:64px}
.text{flex:1}
.lockup{height:72px}
.eyebrow{margin-top:44px;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-size:20px;font-weight:600;
background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.1)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#7aa2ff}
h1{margin-top:26px;white-space:nowrap;font-size:54px;line-height:1.04;font-weight:650;letter-spacing:-.035em}
h1 span{background:linear-gradient(100deg,#fff 10%,#9bb8ff 60%,#c9d6ff);-webkit-background-clip:text;color:transparent}
.meta{margin-top:30px;font-size:22px;color:rgba(232,236,245,.72);font-weight:500}
.meta b{color:#fff;font-weight:600}
.card{width:330px;height:330px;border-radius:64px;padding:14px;flex:none;
background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.14),0 40px 100px -30px rgba(29,91,240,.8)}
.card img{width:100%;height:100%;border-radius:52px;display:block}
</style></head><body><div class="dots"></div>
<div class="wrap"><div class="text">
<img class="lockup" src="../../public/images/v2/brand/bpg-lockup-reversed.webp">
<div><span class="eyebrow"><i></i>Customer-Centric. Beyond Borders.</span></div>
<h1>Building brands.<br>Creating experiences.<br><span>Connecting opportunities.</span></h1>
<p class="meta"><b>Media · Tourism · Trading</b> &nbsp;|&nbsp; India · Qatar · China</p>
</div><div class="card"><img src="../../public/images/v2/brand/bpg-crest.webp"></div></div>
</body></html>
