<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BPG Media share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=block" rel="stylesheet">
<style>
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #f5f7fb;
  background:
    radial-gradient(640px 520px at 12% 10%, rgb(29 91 240 / 0.5), transparent 70%),
    radial-gradient(640px 520px at 100% 100%, rgb(7 41 108 / 0.75), transparent 72%),
    #030407;
}
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / 0.09) 1.2px, transparent 1.3px); background-size: 28px 28px; -webkit-mask-image: radial-gradient(ellipse at 30% 50%, #000 20%, transparent 75%); }
.wrap { position: absolute; inset: 0; padding: 62px 0 58px 72px; display: flex; gap: 48px; align-items: center; }
.text { width: 520px; flex: none; display: flex; flex-direction: column; height: 100%; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { height: 58px; }
.brand span { font-family: "Audiowide", sans-serif; font-size: 34px; letter-spacing: 0.04em; }
.pill { margin-top: 44px; align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; padding: 11px 20px; border-radius: 999px; font-size: 20px; font-weight: 600;
  background: linear-gradient(145deg, rgb(255 255 255 / 0.13), rgb(255 255 255 / 0.04)); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.26), inset 0 0 0 1px rgb(255 255 255 / 0.12); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 0 5px rgb(255 77 94 / 0.22), 0 0 18px rgb(255 77 94 / 0.8); }
h1 { margin-top: 24px; font-size: 76px; line-height: 1; font-weight: 650; letter-spacing: -0.04em; }
h1 span { background: linear-gradient(100deg, #fff 5%, #9bb8ff 60%, #c9d6ff); -webkit-background-clip: text; color: transparent; }
p { margin-top: 20px; font-size: 23px; line-height: 1.4; color: rgb(232 236 245 / 0.74); }
.url { margin-top: auto; font-size: 22px; font-weight: 600; color: #9bb8ff; letter-spacing: 0.01em; }
.photo { flex: 1; height: 100%; position: relative; }
.photo .frame { position: absolute; inset: 0 -40px 0 0; border-radius: 34px 0 0 34px; padding: 12px 0 12px 12px;
  background: linear-gradient(145deg, rgb(255 255 255 / 0.16), rgb(255 255 255 / 0.04)); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.3), inset 0 0 0 1px rgb(255 255 255 / 0.12), 0 40px 90px -30px rgb(29 91 240 / 0.7); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; border-radius: 24px 0 0 24px; display: block; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="wrap">
    <div class="text">
      <div class="brand"><img src="../../media/public/images/brand/bpg-lockup-reversed.webp" alt=""><span>MEDIA</span></div>
      <span class="pill"><span class="dot"></span>Champions Boat League · Live</span>
      <h1>Kerala's boat races, <span>live.</span></h1>
      <p>Kerala's biggest water festivals, streamed live by BPG Media. Free on YouTube.</p>
      <span class="url">media.bepositivegroup.com</span>
    </div>
    <div class="photo"><div class="frame"><img src="../../media/public/images/gallery/bpg-race-07.webp" alt=""></div></div>
  </div>
</body>
</html>
